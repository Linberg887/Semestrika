
{% extends 'planner/base.html' %}

{% block title %}{{ title }} — Semestrika{% endblock %}

{% block content %}

<header class="page-header">
    <span class="eyebrow">ЛИЧНОЕ ПРОСТРАНСТВО</span>
    <h1>{{ title }}</h1>
    <p>{{ description }}</p>
</header>

<section class="panel">
    <h2>{{ title }}</h2>
    <p class="muted">{{ message }}</p>
    <p>Раздел находится в разработке.</p>
</section>

<a class="deadline" href="{% url 'planner:home' %}">
    ← Вернуться к обзору
</a>

{% endblock %}
